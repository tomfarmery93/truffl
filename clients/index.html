/* ── Supabase helpers (same shape as the dashboard) ── */
function headers() {
  const h = { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` };
  if (authToken) h['Authorization'] = `Bearer ${authToken}`;
  return h;
}
async function sbGet(table, params) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: headers() });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || `Request failed (${r.status})`); }
  return await r.json();
}
async function sbInsert(table, rows) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method:'POST', headers: { ...headers(), 'Prefer':'return=representation' }, body: JSON.stringify(rows) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Insert failed'); }
  return await r.json();
}
async function sbPatch(table, col, val, updates) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${col}=eq.${val}`, { method:'PATCH', headers: { ...headers(), 'Prefer':'return=representation' }, body: JSON.stringify(updates) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Update failed'); }
  const data = await r.json();
  if (Array.isArray(data) && data.length === 0) throw new Error("Couldn't save. You may not have permission, or the item no longer exists.");
  return data;
}
async function sbDelete(table, col, val) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${col}=eq.${val}`, { method:'DELETE', headers: headers() });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Delete failed'); }
}

/* ── Utilities ── */
function esc(s) { return (s == null ? '' : s.toString()).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function attr(s) { return esc(s).replace(/'/g, '&#39;'); }
function showMsg(t, type) { const el = document.getElementById('pageMsg'); el.textContent = t; el.className = `msg ${type}`; if (type === 'success') setTimeout(() => { if (el.textContent === t) el.className = 'msg'; }, 4000); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function fullName(c) { return `${c.first_name || ''} ${c.last_name || ''}`.trim() || 'Client'; }
function initials(c) { return (((c.first_name || '')[0] || '') + ((c.last_name || '')[0] || '')).toUpperCase() || '?'; }
function activePets(c) { return (c.client_pets || []).filter(p => p.is_active !== false); }
function petLine(c) { const ps = activePets(c); if (!ps.length) return 'No dogs added yet'; return ps.map(p => p.name + (p.breed ? ` (${p.breed})` : '')).join(', '); }
// Australian mobile/landline to E.164 for WhatsApp; other formats pass through as digits.
function e164(phone) {
  let d = (phone || '').replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('+')) return d;
  if (d.startsWith('0') && d.length === 10) return '+61' + d.slice(1);
  if (d.startsWith('61') && d.length === 11) return '+' + d;
  return '+' + d;
}
function ageFromDob(dob) {
  if (!dob) return '';
  const d = new Date(dob + 'T00:00:00'); if (isNaN(d)) return '';
  const months = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24 * 30.44);
  if (months < 12) return `${Math.max(1, Math.round(months))} mo`;
  return `${Math.floor(months / 12)} yr${Math.floor(months / 12) === 1 ? '' : 's'}`;
}
function fmtDateTime(iso) { const d = new Date(iso); return d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }) + ' · ' + d.toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' }); }
function money(c) { return '$' + ((c || 0) / 100).toFixed(2).replace(/\.00$/, ''); }

// Quick action icons for a client or a phone/email pair (GitHub #148).
function quickActionsHtml(c, size) {
  const out = [];
  const ph = (c.phone || '').trim();
  const stop = 'onclick="event.stopPropagation()"';
  if (ph) {
    out.push(`<a class="icon-btn" href="tel:${attr(ph)}" title="Call" ${stop}>${ICONS.phone}</a>`);
    out.push(`<a class="icon-btn" href="sms:${attr(ph)}" title="Text" ${stop}>${ICONS.sms}</a>`);
    out.push(`<a class="icon-btn wa" href="https://wa.me/${attr(e164(ph).replace('+',''))}" target="_blank" rel="noopener" title="WhatsApp" ${stop}>${ICONS.wa}</a>`);
  }
  if ((c.email || '').trim()) out.push(`<a class="icon-btn" href="mailto:${attr(c.email.trim())}" title="Email" ${stop}>${ICONS.mail}</a>`);
  const addr = [c.address, c.suburb, c.postcode].filter(Boolean).join(', ');

function visibleClients() {
  const q = query.trim().toLowerCase();
  return clients.filter(c => {
    if (filter === 'archived') { if (!c.is_archived) return false; }
    else if (c.is_archived) return false;
    if (filter === 'truffl' && c.source !== 'truffl') return false;
    if (filter === 'own' && c.source === 'truffl') return false;
    if (!q) return true;
    const hay = [fullName(c), c.suburb, c.phone, c.email, ...activePets(c).map(p => p.name + ' ' + (p.breed || ''))].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a, b) => fullName(a).localeCompare(fullName(b)));
}

function renderList() {
  const list = document.getElementById('list'); if (!list) return;
  const rows = visibleClients();
  if (!rows.length) {

async function openClient(id) {
  const c = clients.find(x => x.id === id); if (!c) return;
  history.replaceState(null, '', `/clients/?id=${id}`);
  renderClientSheet(c);
  if (!jobsByClient[id]) {
    try {
      const since = new Date(Date.now() - 60 * 864e5).toISOString();
      jobsByClient[id] = await sbGet('provider_schedule', `client_id=eq.${id}&starts_at=gte.${since}&select=kind,id,client_name,pet_names,service_type,starts_at,ends_at,status,price_cents,is_paid,source,is_meet_and_greet&order=starts_at.asc&limit=40`);
    } catch (e) { jobsByClient[id] = []; }
    if (document.getElementById(`jobs-${id}`)) renderClientSheet(c);
  }
}

async function archiveClient(id, archive) {
  try {
    const rows = await sbPatch('clients', 'id', id, { is_archived: archive });

    closeModal(); renderPage();
    showMsg(archive ? 'Client archived. You can find them under the Archived filter.' : 'Client restored.', 'success');
  } catch (e) { showMsg(e.message, 'error'); }
}

function readPetForms() {

             behaviour_notes: g('pet_behaviour') || null, medical_notes: g('pet_medical') || null, vet_name: g('pet_vet') || null, vet_phone: g('pet_vet_phone') || null };
  }).filter(p => p.name);
}

async function saveClient(ev, id) {
  ev.preventDefault();
  const f = ev.target; const g = n => (f.querySelector(`[name="${n}"]`).value || '').trim();
  const row = { first_name: g('first_name'), last_name: g('last_name') || null, phone: g('phone') || null, email: g('email') || null,
                address: g('address') || null, suburb: g('suburb') || null, postcode: g('postcode') || null, notes: g('notes') || null,
                tags: g('tags').split(',').map(t => t.trim()).filter(Boolean) };
  if (!row.first_name) return;
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    let client;
    if (id) {
      const rows = await sbPatch('clients', 'id', id, row); client = rows[0];
    } else {
      const rows = await sbInsert('clients', { ...row, provider_user_id: authUid, source: 'manual' }); client = rows[0];
    }
    // Pets: patch the ones that still exist, insert new ones, deactivate the removed (keeps job history intact).
    const existing = id ? activePets(clients.find(x => x.id === id)) : [];
    const forms = readPetForms();
    const keep = new Set(forms.filter(p => p.id).map(p => p.id));
    const toInsert = forms.filter(p => !p.id).map(({ id: _i, ...p }) => ({ ...p, client_id: client.id }));
    const ops = [];
    for (const p of forms.filter(p => p.id)) { const { id: pid, ...upd } = p; ops.push(sbPatch('client_pets', 'id', pid, upd)); }
    for (const p of existing.filter(p => !keep.has(p.id))) ops.push(sbPatch('client_pets', 'id', p.id, { is_active: false }));
    if (toInsert.length) ops.push(sbInsert('client_pets', toInsert));
    await Promise.all(ops);
    client.client_pets = await sbGet('client_pets', `client_id=eq.${client.id}&select=*&order=created_at.asc`);
    const idx = clients.findIndex(x => x.id === client.id);
    if (idx >= 0) clients[idx] = client; else clients.push(client);
    delete jobsByClient[client.id];
    closeModal(); renderPage();
    showMsg(id ? 'Client updated.' : `${fullName(client)} added to your client book.`, 'success');
    if (!id) openClient(client.id);
  } catch (e) { btn.disabled = false; btn.textContent = id ? 'Save changes' : 'Add client'; alert(e.message); }
}

/* ── CSV import (GitHub #149) ── */
let csvRows = null, csvHeaders = null;
const TEMPLATE_CSV = 'first_name,last_name,phone,email,address,suburb,postcode,dog_name,dog_breed,notes\nSam,Taylor,0412 345 678,sam@example.com,12 Example St,Newtown,2042,Rex,Kelpie,Gate code 1234\n';
function downloadTemplate() {
  const blob = new Blob([TEMPLATE_CSV], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'truffl-clients-template.csv'; a.click();
}
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
// Map a header to one of our fields. Tolerant of the exports carers actually have.
const HEADER_MAP = [
  ['first_name', /^(first[ _]?name|first|given|owner[ _]?first)$/i],
  ['last_name', /^(last[ _]?name|last|surname|family|owner[ _]?last)$/i],
  ['name', /^(name|full[ _]?name|client|owner|owner[ _]?name|customer|contact)$/i],
  ['phone', /^(phone|mobile|mobile[ _]?number|phone[ _]?number|cell|tel|telephone)$/i],
  ['email', /^(e-?mail|email[ _]?address)$/i],
  ['address', /^(address|street|street[ _]?address|address[ _]?1)$/i],
  ['suburb', /^(suburb|city|town|locality)$/i],
  ['postcode', /^(post[ _]?code|zip|zip[ _]?code|postal[ _]?code)$/i],
  ['dog_name', /^(dog|dog[ _]?name|pet|pet[ _]?name|dogs|pets)$/i],
  ['dog_breed', /^(breed|dog[ _]?breed|pet[ _]?breed)$/i],
  ['notes', /^(notes?|comments?|remarks?)$/i],
];
function mapHeader(h) { const t = (h || '').trim(); for (const [k, re] of HEADER_MAP) if (re.test(t)) return k; return null; }

function openImport() {
  csvRows = null; csvHeaders = null;
  modal(`
    <div class="sheet-head"><h2>Import clients</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div>
    <p style="font-size:0.86rem;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;">Upload a CSV from a spreadsheet or another platform. We recognise columns like name, phone, email, address, suburb, dog and breed. Rows matching an existing client's phone or email update that client instead of duplicating them. <button class="link-btn" onclick="downloadTemplate()">Download a template</button></p>
    <label class="drop" id="drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');onCsvFile(event.dataTransfer.files[0])">
      <input type="file" accept=".csv,text/csv" onchange="onCsvFile(this.files[0])">
      <div>Tap to choose a .csv file, or drop it here</div>
    </label>
    <div id="csvPreview"></div>`);
}
async function onCsvFile(file) {
  if (!file) return;
  const text = await file.text();
  const rows = parseCsv(text);
  if (rows.length < 2) { document.getElementById('csvPreview').innerHTML = '<div class="msg error" style="display:block;margin-top:10px;">That file has no data rows.</div>'; return; }
  csvHeaders = rows[0].map(h => ({ raw: h, key: mapHeader(h) }));
  csvRows = rows.slice(1);
  const known = csvHeaders.filter(h => h.key);
  const hasName = known.some(h => h.key === 'name' || h.key === 'first_name');
  document.getElementById('csvPreview').innerHTML = `
    <div class="kv" style="margin-top:12px;">${csvRows.length} row${csvRows.length === 1 ? '' : 's'}. Recognised columns: ${known.length ? known.map(h => `<b>${esc(h.raw)}</b>`).join(', ') : '<span style="color:var(--error)">none</span>'}.${hasName ? '' : ' <span style="color:var(--error)">A name column is required.</span>'}</div>
    <div class="preview"><table><thead><tr>${csvHeaders.map(h => `<th>${esc(h.raw)}${h.key ? '' : ' <span style="color:var(--text-muted);font-weight:400">(ignored)</span>'}</th>`).join('')}</tr></thead>
      <tbody>${csvRows.slice(0, 5).map(r => `<tr>${csvHeaders.map((h, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="form-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="importBtn" ${hasName ? '' : 'disabled'} onclick="runImport()">Import ${csvRows.length} client${csvRows.length === 1 ? '' : 's'}</button></div>`;
}
function normPhone(p) { return (p || '').replace(/\D/g, '').replace(/^61/, '0'); }
async function runImport() {
  const btn = document.getElementById('importBtn'); btn.disabled = true; btn.textContent = 'Importing…';
  const byPhone = {}, byEmail = {};
  clients.forEach(c => { if (c.phone) byPhone[normPhone(c.phone)] = c; if (c.email) byEmail[c.email.trim().toLowerCase()] = c; });
  let created = 0, updated = 0, skipped = 0;
  const inserts = [], insertPets = [];
  try {
    for (const r of csvRows) {
      const v = {}; csvHeaders.forEach((h, i) => { if (h.key) v[h.key] = (r[i] || '').trim(); });
      let first = v.first_name || '', last = v.last_name || '';
      if (!first && v.name) { const parts = v.name.split(/\s+/); first = parts.shift(); last = parts.join(' '); }
      if (!first) { skipped++; continue; }
      const row = { first_name: first, last_name: last || null, phone: v.phone || null, email: v.email || null, address: v.address || null, suburb: v.suburb || null, postcode: v.postcode || null, notes: v.notes || null };
      const match = (v.phone && byPhone[normPhone(v.phone)]) || (v.email && byEmail[v.email.toLowerCase()]);
      const dogs = (v.dog_name || '').split(/[;,&]| and /i).map(s => s.trim()).filter(Boolean).map((name, i) => ({ name, breed: i === 0 ? (v.dog_breed || null) : null }));
      if (match) {
        const upd = {}; Object.entries(row).forEach(([k, val]) => { if (val && !match[k]) upd[k] = val; });
        if (Object.keys(upd).length) { const rows = await sbPatch('clients', 'id', match.id, upd); Object.assign(match, rows[0]); }
        const have = new Set(activePets(match).map(p => p.name.toLowerCase()));
        const newDogs = dogs.filter(d => !have.has(d.name.toLowerCase())).map(d => ({ ...d, client_id: match.id }));
        if (newDogs.length) { const ins = await sbInsert('client_pets', newDogs); match.client_pets = (match.client_pets || []).concat(ins); }
        updated++;
      } else {
        inserts.push({ ...row, provider_user_id: authUid, source: 'import', _dogs: dogs });
      }
    }
    if (inserts.length) {
      const payload = inserts.map(({ _dogs, ...rest }) => rest);
      const rows = await sbInsert('clients', payload);
      rows.forEach((c, i) => { c.client_pets = []; clients.push(c); inserts[i]._dogs.forEach(d => insertPets.push({ ...d, client_id: c.id })); });
      created = rows.length;
      if (insertPets.length) {
        const pets = await sbInsert('client_pets', insertPets);
        pets.forEach(p => { const c = clients.find(x => x.id === p.client_id); if (c) c.client_pets.push(p); });
      }
    }
    closeModal(); renderPage();
    showMsg(`Import done: ${created} added, ${updated} updated, ${skipped} skipped (no name).`, 'success');
  } catch (e) { btn.disabled = false; btn.textContent = 'Import'; alert('Import stopped: ' + e.message); await loadClients(); renderPage(); }
}

/* ── Boot ── */
async function loadClients() {
  clients = await sbGet('clients', `provider_user_id=eq.${authUid}&select=*,client_pets(*)&order=first_name.asc`);
}

async function init() {
  const area = document.getElementById('content');
  const stored = localStorage.getItem('truffl_session');
  if (stored) { try { const s = JSON.parse(stored); authToken = s.access_token; authUid = s.user_id; } catch (e) {} }
  if (!authToken) {
    area.innerHTML = `<div class="login-prompt"><h2>Sign in to see your clients</h2><p>Your client book lives in your carer account.</p><a href="/login/?redirect=/clients/">Sign in</a></div>`;
    return;
  }
  try {
    const users = await sbGet('users', `id=eq.${authUid}&select=first_name,last_name,role`);
    if (!users.length) { localStorage.removeItem('truffl_session'); location.href = '/login/?redirect=/clients/'; return; }
    userData = users[0];
    if (userData.role !== 'provider') {
      area.innerHTML = `<div class="login-prompt"><h2>This is the carer client book</h2><p>You're signed in as an owner. <a href="/profile/">Go to your profile</a></p></div>`;
      return;
    }
    const ini = ((userData.first_name || '')[0] || '') + ((userData.last_name || '')[0] || '');
    document.getElementById('navUser').innerHTML = `<a href="/profile/" title="Your profile" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;"><div class="nav-avatar">${esc(ini)}</div><span class="nav-name">${esc(userData.first_name)}</span></a>`;
    await loadClients();
    renderPage();
    const params = new URLSearchParams(location.search);
    if (params.get('new')) openClientForm();
    else if (params.get('id')) openClient(params.get('id'));
  } catch (e) {
    area.innerHTML = `<div class="login-prompt"><h2>Something went wrong</h2><p>${esc(e.message)}</p><a href="/login/?redirect=/clients/">Try signing in again</a></div>`;
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
