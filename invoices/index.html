<script>

   invoice carries the carer's own bank details, the client pays them directly, and the carer
   marks it paid. Same conventions as /clients/: inline script, PostgREST under RLS, the
   money-shaped writes go through definer RPCs (create_invoice, set_invoice_paid, void_invoice). */
const SUPABASE_URL = 'https://gadflsntbnbnnxbpiral.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhZGZsc250Ym5ibm54YnBpcmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNjcwNTcsImV4cCI6MjA5MDY0MzA1N30.g5ZrqeAX9U5l7oDZEbQFrU5j10828dUF0QuJ0ZlHXK8';
const SERVICE_LABELS = { dog_walking:'Walk', dog_sitting:'Sitting', dog_boarding:'Boarding', pet_sitting:'Visit' };
const PAY_LABELS = { cash:'Cash', bank_transfer:'Transfer', card:'Card', other:'Other' };

let authToken = null, authUid = null, userData = null;
let invoices = [];
let clients = [];
let settings = null;
let filter = 'unpaid';

function headers(extra) {
  const h = { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` };
  if (authToken) h['Authorization'] = `Bearer ${authToken}`;
  return Object.assign(h, extra || {});
}
async function sbGet(table, params) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: headers() });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || `Request failed (${r.status})`); }
  return await r.json();
}
async function sbUpsert(table, row, onConflict) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${onConflict}`, { method:'POST', headers: headers({ 'Prefer':'return=representation,resolution=merge-duplicates' }), body: JSON.stringify(row) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Save failed'); }
  return await r.json();
}
async function sbPatch(table, col, val, updates) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${col}=eq.${val}`, { method:'PATCH', headers: headers({ 'Prefer':'return=representation' }), body: JSON.stringify(updates) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Update failed'); }
  return await r.json();
}
async function sbRpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers: headers(), body: JSON.stringify(args || {}) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'Request failed'); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

function esc(s) { return (s == null ? '' : s.toString()).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function attr(s) { return esc(s).replace(/'/g, '&#39;'); }
function showMsg(t, type) { const el = document.getElementById('pageMsg'); el.textContent = t; el.className = `msg ${type}`; if (type === 'success') setTimeout(() => { if (el.textContent === t) el.className = 'msg'; }, 4000); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function money(c) { return '$' + ((c || 0) / 100).toFixed(2); }
function dollarsToCents(s) { const t = (s || '').toString().replace(/[^0-9.]/g, ''); if (!t) return null; const n = Math.round(parseFloat(t) * 100); return isNaN(n) || n < 0 ? null : n; }
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtDate(s) { if (!s) return ''; return new Date(s.length === 10 ? s + 'T12:00:00' : s).toLocaleDateString('en-AU', { day:'numeric', month:'short', year: 'numeric' }); }
function fmtShort(s) { if (!s) return ''; return new Date(s.length === 10 ? s + 'T12:00:00' : s).toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' }).replace(' ', '').toLowerCase(); }
function clientName(c) { return c ? (`${c.first_name || ''} ${c.last_name || ''}`.trim() || 'Client') : 'Client'; }
function activePets(c) { return (c && c.client_pets || []).filter(p => p.is_active !== false); }
function isOverdue(i) { return i.status === 'unpaid' && i.due_on && i.due_on < ymd(new Date()); }
function publicLink(i) { return `${location.origin}/invoice/?t=${i.share_token}`; }
function track(name, params) { try { gtag('event', name, params || {}); } catch (e) {} }
function settingsReady() { return !!(settings && (settings.bank_bsb || settings.payid || settings.payment_notes)); }

/* ── Loading ── */
async function loadAll() {
  [invoices, clients, settings] = await Promise.all([
    sbGet('invoices', `provider_user_id=eq.${authUid}&select=*,invoice_items(*)&order=sequence.desc`),
    sbGet('clients', `provider_user_id=eq.${authUid}&is_archived=eq.false&select=id,first_name,last_name,phone,email,suburb,client_pets(id,name,is_active)&order=first_name.asc`),
    sbGet('invoice_settings', `provider_user_id=eq.${authUid}&select=*`).then(r => r[0] || null),
  ]);
}

/* ── Rendering ── */
function statusPill(i) {
  if (i.status === 'paid') return '<span class="status-pill st-paid">Paid</span>';
  if (i.status === 'void') return '<span class="status-pill st-void">Void</span>';
  if (isOverdue(i)) return '<span class="status-pill st-overdue">Overdue</span>';
  return `<span class="status-pill st-unpaid">${i.sent_at ? 'Sent' : 'Unpaid'}</span>`;
}
function renderPage() {
  const unpaid = invoices.filter(i => i.status === 'unpaid');
  const outstanding = unpaid.reduce((s, i) => s + i.total_cents, 0);
  const overdue = unpaid.filter(isOverdue).reduce((s, i) => s + i.total_cents, 0);
  const monthStart = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const paidMonth = invoices.filter(i => i.status === 'paid' && i.paid_at && i.paid_at.slice(0, 10) >= monthStart).reduce((s, i) => s + i.total_cents, 0);
  const list = invoices.filter(i => filter === 'all' ? true : (filter === 'paid' ? i.status === 'paid' : i.status === 'unpaid'));
  document.getElementById('content').innerHTML = `
    <div class="welcome">
      <div><h1>Invoices</h1><p>${invoices.length ? `${unpaid.length} unpaid` : 'Send a proper invoice, get paid straight to your account.'}</p></div>
      <div class="welcome-actions">
        <button class="btn secondary" onclick="openSettings()">${ICONS.gear} Settings</button>
        <button class="btn primary" onclick="openNew()">${ICONS.plus} New invoice</button>
      </div>
    </div>
    ${!settingsReady() ? `<div class="setup-note">Add your bank details or PayID in <button onclick="openSettings()">invoice settings</button> so clients know how to pay you. ABN and GST live there too.</div>` : ''}
    ${invoices.length ? `<div class="totals">
      <div class="tot"><div class="tot-v">${money(outstanding)}</div><div class="tot-l">Outstanding</div></div>
      <div class="tot"><div class="tot-v" style="${overdue ? 'color:var(--error)' : ''}">${money(overdue)}</div><div class="tot-l">Overdue</div></div>
      <div class="tot"><div class="tot-v">${money(paidMonth)}</div><div class="tot-l">Paid this month</div></div>
    </div>
    <div class="chips" style="margin-bottom:12px;">${[['unpaid','Unpaid'],['paid','Paid'],['all','All']].map(([k, v]) => `<button class="chip ${filter === k ? 'active' : ''}" onclick="filter='${k}';renderPage()">${v}</button>`).join('')}</div>
    <div id="list">${list.length ? list.map(invCardHtml).join('') : '<div class="empty">Nothing here.</div>'}</div>` : `
    <div class="empty"><h3>No invoices yet</h3>Pick a client, tick the walks they owe you for, and Truffl writes the invoice with your ABN and bank details. Send it as a link, mark it paid when the money lands.
      <div><button class="btn primary" onclick="openNew()">${ICONS.plus} New invoice</button></div></div>`}`;
}
function invCardHtml(i) {
  const c = clients.find(x => x.id === i.client_id);
  return `<div class="inv" onclick="openInvoice('${i.id}')">
    <div class="inv-num"><b>${esc(i.number)}</b>${esc(fmtShort(i.issued_on))}</div>
    <div class="inv-body"><div class="inv-client">${esc(i.client_name)}</div>
      <div class="inv-sub">${(i.invoice_items || []).length} line${(i.invoice_items || []).length === 1 ? '' : 's'}${i.status === 'unpaid' && i.due_on ? ` · due ${esc(fmtShort(i.due_on))}` : ''}${i.status === 'paid' && i.paid_at ? ` · paid ${esc(fmtShort(i.paid_at))}${i.payment_method ? ' by ' + esc(PAY_LABELS[i.payment_method] || i.payment_method).toLowerCase() : ''}` : ''}${c && c.suburb ? ` · ${esc(c.suburb)}` : ''}</div></div>
    <div class="inv-amt"><b>${money(i.total_cents)}</b>${statusPill(i)}</div>
  </div>`;
}

/* ── Modal plumbing ── */
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; document.body.style.overflow = ''; if (/[?&](new|id|client)=/.test(location.search)) history.replaceState(null, '', '/invoices/'); }
function modal(html) { document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; document.body.style.overflow = 'hidden'; }

/* ── New invoice ── */
let draft = null;
async function openNew(clientId) {
  draft = { client_id: clientId || '', jobs: [], extras: [], issued_on: ymd(new Date()), due_on: '', notes: '' };
  renderNew();
  if (draft.client_id) await loadDraftJobs();
}
async function loadDraftJobs() {
  draft.jobs = null; renderNew();
  try {
    const rows = await sbGet('jobs', `provider_user_id=eq.${authUid}&client_id=eq.${draft.client_id}&status=neq.cancelled&paid_at=is.null&invoice_id=is.null&price_cents=gt.0&select=id,starts_at,ends_at,service_type,price_cents,title,status,job_pets(client_pets(name))&order=starts_at.asc&limit=200`);
    const now = Date.now();
    draft.jobs = rows.map(j => ({ ...j, pets: (j.job_pets || []).map(p => p.client_pets && p.client_pets.name).filter(Boolean).join(', '), selected: j.status === 'completed' || new Date(j.starts_at).getTime() < now }));
  } catch (e) { draft.jobs = []; showMsg(e.message, 'error'); }
  renderNew();
}
function draftTotal() {
  const jobs = (draft.jobs || []).filter(j => j.selected).reduce((s, j) => s + j.price_cents, 0);
  const extras = draft.extras.reduce((s, x) => s + (dollarsToCents(x.amount) || 0), 0);
  return jobs + extras;
}
function renderNew() {
  const d = draft;
  const c = clients.find(x => x.id === d.client_id);
  const dueDefault = (() => { const x = new Date(d.issued_on + 'T12:00:00'); x.setDate(x.getDate() + ((settings && settings.due_days) != null ? settings.due_days : 7)); return ymd(x); })();
  const total = draftTotal();
  const gst = settings && settings.gst_registered;
  modal(`
    <div class="sheet-head"><h2>New invoice</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div>
    <form onsubmit="createInvoice(event)">
      <div class="form-grid">
        <div class="field full"><label>Client</label>
          <select onchange="draft.client_id=this.value;draft.extras=[];loadDraftJobs()" required>
            <option value="">Choose a client</option>
            ${clients.map(x => `<option value="${x.id}" ${x.id === d.client_id ? 'selected' : ''}>${esc(clientName(x))}${x.suburb ? ' · ' + esc(x.suburb) : ''}</option>`).join('')}
          </select></div>
      </div>
      ${c ? `<div class="section-label"><span>Unpaid work</span>${d.jobs && d.jobs.length ? `<button type="button" class="link-btn" onclick="draft.jobs.forEach(j=>j.selected=true);renderNew()">Select all</button>` : ''}</div>
      <div class="card" style="padding:6px 14px;">
        ${d.jobs == null ? '<div class="kv" style="color:var(--text-muted);padding:6px 0;">Loading…</div>' : d.jobs.length ? d.jobs.map((j, i) => `<label class="jobpick">
          <input type="checkbox" ${j.selected ? 'checked' : ''} onchange="draft.jobs[${i}].selected=this.checked;renderNew()">
          <span class="t"><b>${esc(fmtShort(j.starts_at))}, ${esc(fmtTime(j.starts_at))}</b> · ${esc(SERVICE_LABELS[j.service_type] || j.service_type)}${j.pets ? ' · ' + esc(j.pets) : ''}${j.status !== 'completed' ? ' <span class="status-pill st-scheduled">upcoming</span>' : ''}</span>
          <b>${money(j.price_cents)}</b></label>`).join('') : `<div class="kv" style="color:var(--text-muted);padding:6px 0;">No unpaid priced jobs for ${esc(clientName(c))}. Add a line below, or <a href="/schedule/?new=1&client=${c.id}" style="color:var(--terracotta)">add a walk</a> with a price first.</div>`}
      </div>
      <div class="section-label"><span>Other lines</span><button type="button" class="link-btn" onclick="draft.extras.push({description:'',amount:''});renderNew()">+ Add a line</button></div>
      ${d.extras.map((x, i) => `<div class="extra-row">
        <input placeholder="e.g. Treats, key cutting, extra dog" value="${attr(x.description)}" oninput="draft.extras[${i}].description=this.value">
        <input placeholder="$" inputmode="decimal" value="${attr(x.amount)}" oninput="draft.extras[${i}].amount=this.value" onchange="renderNew()">
        <button type="button" class="close" style="width:30px;height:30px;font-size:.9rem;" onclick="draft.extras.splice(${i},1);renderNew()" aria-label="Remove">×</button></div>`).join('')}
      <div class="form-grid" style="margin-top:10px;">
        <div class="field"><label>Issue date</label><input type="date" value="${attr(d.issued_on)}" onchange="draft.issued_on=this.value;renderNew()" required></div>
        <div class="field"><label>Due</label><input type="date" value="${attr(d.due_on || dueDefault)}" onchange="draft.due_on=this.value"></div>
        <div class="field full"><label>Note to client (optional)</label><input value="${attr(d.notes)}" oninput="draft.notes=this.value" placeholder="Thanks for having me, see you next week"></div>
      </div>
      <div class="card" style="margin-top:12px;">
        <div class="line total"><span>Total${gst ? ' (includes GST)' : ''}</span><span>${money(total)}</span></div>
        ${gst ? `<div class="kv" style="font-size:.78rem;">GST component ${money(Math.round(total / 11))}. Your prices are treated as GST-inclusive, as quoted.</div>` : ''}
        <div class="kv" style="font-size:.78rem;">Numbered ${esc((settings && settings.invoice_prefix) || 'INV-')}${String((settings && settings.next_number) || 1).padStart(4, '0')}. ${settingsReady() ? 'Your payment details go in the footer.' : '<b style="color:var(--warning)">No payment details yet</b>: add them in Settings first.'}</div>
      </div>` : ''}
      <div class="form-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn primary" id="createBtn" ${c && total > 0 ? '' : 'disabled'}>Create invoice</button>
      </div>
    </form>`);
}
async function createInvoice(ev) {
  ev.preventDefault();
  const d = draft;
  const btn = document.getElementById('createBtn'); btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const extras = d.extras.map(x => ({ description: x.description.trim(), amount_cents: dollarsToCents(x.amount) })).filter(x => x.description && x.amount_cents > 0);
    const id = await sbRpc('create_invoice', { p_client_id: d.client_id, p_job_ids: (d.jobs || []).filter(j => j.selected).map(j => j.id), p_extra_items: extras, p_issued_on: d.issued_on, p_due_on: d.due_on || null, p_notes: d.notes.trim() || null });
    track('invoice_created', { lines: (d.jobs || []).filter(j => j.selected).length + extras.length });
    await loadAll(); filter = 'unpaid'; renderPage();
    openInvoice(id);
    showMsg('Invoice created. Send it when you are ready.', 'success');
  } catch (e) { btn.disabled = false; btn.textContent = 'Create invoice'; alert(e.message); }
}

/* ── Detail ── */
let payChoice = false;
function openInvoice(id) {
  const i = invoices.find(x => x.id === id); if (!i) return;
  history.replaceState(null, '', `/invoices/?id=${id}`);
  const c = clients.find(x => x.id === i.client_id);
  const items = (i.invoice_items || []).slice().sort((a, b) => a.sort_order - b.sort_order);
  const link = publicLink(i);
  const live = i.status !== 'void';
  modal(`
    <div class="sheet-head"><h2>${esc(i.number)} ${statusPill(i)}</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div>
    <div class="card">
      <div class="kv"><div><b>${esc(i.client_name)}</b>${c && c.email ? ` · ${esc(c.email)}` : ''}${c && c.phone ? ` · ${esc(c.phone)}` : ''}</div>
        <div>Issued ${esc(fmtDate(i.issued_on))}${i.due_on ? ` · due ${esc(fmtDate(i.due_on))}` : ''}${i.sent_at ? ` · sent ${esc(fmtShort(i.sent_at))}` : ''}${i.paid_at ? ` · paid ${esc(fmtShort(i.paid_at))}${i.payment_method ? ' by ' + esc(PAY_LABELS[i.payment_method] || i.payment_method).toLowerCase() : ''}` : ''}</div></div>
      <div style="margin-top:10px;">
        ${items.map(it => `<div class="line"><span><b>${esc(it.description)}</b>${Number(it.quantity) !== 1 ? ` × ${esc(String(Number(it.quantity)))}` : ''}</span><span>${money(it.amount_cents)}</span></div>`).join('')}
        ${i.gst_applied ? `<div class="line"><span>Includes GST</span><span>${money(i.gst_cents)}</span></div>` : ''}
        <div class="line total"><span>Total</span><span>${money(i.total_cents)}</span></div>
      </div>
      ${i.notes ? `<div class="kv" style="margin-top:8px;white-space:pre-wrap;">${esc(i.notes)}</div>` : ''}
    </div>
    ${live ? `<div class="card">
      <div class="card-title">Send</div>
      <div class="urlbox"><input readonly value="${attr(link)}" onclick="this.select()"><button class="btn secondary sm" onclick="copyLink('${i.id}')">Copy</button></div>
      <div class="actions-row">
        ${c && (c.phone || c.email) ? `<button class="btn primary sm" onclick="sendInvoice('${i.id}')">Send to ${esc(c.first_name || 'client')}</button>` : '<span class="kv" style="color:var(--text-muted)">Add a mobile or email to the client to send from here.</span>'}
        <a class="btn secondary sm" href="${attr(link)}" target="_blank" rel="noopener">Open</a>
      </div>
      <div class="kv" style="font-size:.78rem;color:var(--text-muted);margin-top:8px;">Anyone with the link can view this invoice. Voiding it turns the link off.</div>
    </div>
    <div class="form-actions">
      ${i.status === 'unpaid' ? `<button class="btn ghost sm left" onclick="voidInvoice('${i.id}')">Void</button>` : ''}
      ${i.status === 'paid' ? `<button class="btn ghost" onclick="setPaid('${i.id}', false)">Mark unpaid</button>` : ''}
      ${i.status === 'unpaid' ? (payChoice ? `<span class="paychoice">Paid by ${['bank_transfer','cash','other'].map(m => `<button class="btn secondary sm" onclick="setPaid('${i.id}', true, '${m}')">${PAY_LABELS[m]}</button>`).join('')}<button class="btn ghost sm" onclick="payChoice=false;openInvoice('${i.id}')">×</button></span>` : `<button class="btn success" style="background:var(--success);color:#fff;" onclick="payChoice=true;openInvoice('${i.id}')">Mark paid</button>`) : ''}
    </div>` : '<div class="kv" style="color:var(--text-muted)">This invoice was voided. The jobs on it can be invoiced again.</div>'}`);
}
async function copyLink(id) {
  const i = invoices.find(x => x.id === id);
  try { await navigator.clipboard.writeText(publicLink(i)); showMsg('Invoice link copied.', 'success'); } catch (e) { const el = document.querySelector('.urlbox input'); if (el) { el.select(); document.execCommand('copy'); } }
  markSent(i);
}
async function markSent(i) {
  if (i.sent_at) return;
  try { const rows = await sbPatch('invoices', 'id', i.id, { sent_at: new Date().toISOString() }); Object.assign(i, rows[0], { invoice_items: i.invoice_items }); renderPage(); } catch (e) { /* cosmetic */ }
}
function sendInvoice(id) {
  const i = invoices.find(x => x.id === id); const c = clients.find(x => x.id === i.client_id); if (!c) return;
  track('invoice_send_opened');
  TrufflMessaging.open({ client: c, pets: activePets(c).map(p => p.name).join(', '), invoice: { id: i.id, number: i.number, total_cents: i.total_cents, due_on: i.due_on, link: publicLink(i) }, preselect: isOverdue(i) ? 'invoice_overdue' : 'invoice_send' });
  markSent(i);
}
async function setPaid(id, paid, method) {
  try {
    await sbRpc('set_invoice_paid', { p_invoice_id: id, p_paid: paid, p_method: method || null });
    track(paid ? 'invoice_paid' : 'invoice_unpaid', { method });
    payChoice = false; await loadAll(); renderPage(); openInvoice(id);
    showMsg(paid ? 'Marked paid. The jobs on it are marked paid too.' : 'Marked unpaid.', 'success');
  } catch (e) { alert(e.message); }
}
async function voidInvoice(id) {
  if (!confirm('Void this invoice? The number is kept, the link stops working, and the jobs on it can be invoiced again.')) return;
  try { await sbRpc('void_invoice', { p_invoice_id: id }); await loadAll(); closeModal(); renderPage(); showMsg('Invoice voided.', 'success'); }
  catch (e) { alert(e.message); }
}

      </div>
      <div class="section-label"><span>How clients pay you</span></div>
      <div class="form-grid">
        ${f('bank_account_name', 'Account name', 'J Walker', { full: true })}
        ${f('bank_bsb', 'BSB', '062-000', { extra: 'inputmode="numeric"' })}
        ${f('bank_account', 'Account number', '12345678', { extra: 'inputmode="numeric"' })}
        ${f('payid', 'PayID', 'Mobile or email', { full: true })}
        ${f('payment_notes', 'Anything else', 'Cash on the day is fine too', { full: true })}
      </div>
      <div class="section-label"><span>Numbering and terms</span></div>

        ${f('footer_note', 'Footer note', 'Thank you for choosing me for your dog', { full: true })}
      </div>
      <div class="form-actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary" id="saveSettingsBtn">Save</button></div>
    </form>`);
}
async function saveSettings(ev) {
  ev.preventDefault();
  const form = ev.target; const btn = document.getElementById('saveSettingsBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  const row = { provider_user_id: authUid };
  ['business_name','abn','phone','email','address','bank_account_name','bank_bsb','bank_account','payid','payment_notes','footer_note'].forEach(k => { row[k] = (form[k].value || '').trim() || null; });
  row.invoice_prefix = (form.invoice_prefix.value || '').trim() || 'INV-';
  row.next_number = Math.max(1, parseInt(form.next_number.value, 10) || 1);
  row.due_days = Math.min(90, Math.max(0, parseInt(form.due_days.value, 10) || 0));
  row.gst_registered = form.gst_registered.checked;
  try {
    const rows = await sbUpsert('invoice_settings', row, 'provider_user_id'); settings = rows[0];
    closeModal(); renderPage(); showMsg('Invoice settings saved.', 'success');
  } catch (e) { btn.disabled = false; btn.textContent = 'Save'; alert(e.message); }
}

/* ── Boot ── */
async function init() {
  const area = document.getElementById('content');
  const stored = localStorage.getItem('truffl_session');
  if (stored) { try { const s = JSON.parse(stored); authToken = s.access_token; authUid = s.user_id; } catch (e) {} }
  if (!authToken) {
    area.innerHTML = `<div class="login-prompt"><h2>Sign in to see your invoices</h2><p>Invoices live in your carer account.</p><a href="/login/?redirect=/invoices/">Sign in</a></div>`;
    return;
  }
  try {
    const users = await sbGet('users', `id=eq.${authUid}&select=first_name,last_name,role`);
    if (!users.length) { localStorage.removeItem('truffl_session'); location.href = '/login/?redirect=/invoices/'; return; }
    userData = users[0];
    if (userData.role !== 'provider') {
      area.innerHTML = `<div class="login-prompt"><h2>This is the carer invoicing page</h2><p>You're signed in as an owner. <a href="/profile/">Go to your profile</a></p></div>`;
      return;
    }
    const ini = ((userData.first_name || '')[0] || '') + ((userData.last_name || '')[0] || '');
    document.getElementById('navUser').innerHTML = `<a href="/profile/" title="Your profile" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;"><div class="nav-avatar">${esc(ini)}</div><span class="nav-name">${esc(userData.first_name)}</span></a>`;
    TrufflMessaging.init({ supabaseUrl: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY, token: authToken, uid: authUid, carerFirstName: userData.first_name });
    await loadAll();
    renderPage();
    const params = new URLSearchParams(location.search);
    if (params.get('new')) openNew(params.get('client') || '');
    else if (params.get('id')) openInvoice(params.get('id'));
    else if (params.get('settings')) openSettings();
  } catch (e) {
    area.innerHTML = `<div class="login-prompt"><h2>Something went wrong</h2><p>${esc(e.message)}</p><a href="/login/?redirect=/invoices/">Try signing in again</a></div>`;
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
